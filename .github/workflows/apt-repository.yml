name: Publish APT repository

on:
  workflow_dispatch:
    inputs:
      codename:
        description: Debian/Ubuntu codename(s) to publish, for example "stretch buster"
        required: true
        default: stretch buster
      component:
        description: APT component name
        required: true
        default: vesta
  push:
    paths:
      - 'apt/pool/**/*.deb'
      - 'scripts/build-apt-repository.sh'
      - 'scripts/build-vesta-deb.sh'
      - 'src/deb/vesta/**'
      - '.github/workflows/apt-repository.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APT_CODENAMES: ${{ github.event.inputs.codename || 'stretch buster' }}
      APT_COMPONENT: ${{ github.event.inputs.component || 'vesta' }}
      APT_INPUT_DIR: /tmp/vesta-apt-pool
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils dpkg-dev gnupg

      - name: Build package pool
        run: |
          rm -rf "$APT_INPUT_DIR"
          install -d "$APT_INPUT_DIR"
          find apt/pool -type f -name '*.deb' -exec cp '{}' "$APT_INPUT_DIR/" ';'
          ./scripts/build-vesta-deb.sh --output "$APT_INPUT_DIR"
          find "$APT_INPUT_DIR" -maxdepth 1 -type f -name '*.deb' -print

      - name: Import signing key
        if: ${{ env.APT_GPG_PRIVATE_KEY != '' }}
        id: gpg
        run: |
          install -m 700 -d ~/.gnupg
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          if [ -n "$APT_GPG_PASSPHRASE" ]; then
            printf '%s' "$APT_GPG_PASSPHRASE" > ~/.gnupg/passphrase
            chmod 600 ~/.gnupg/passphrase
          fi
          key_id=$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "sec" { print $5; exit }')
          if [ -z "$key_id" ]; then
            echo "No secret key was imported" >&2
            exit 1
          fi
          echo "key-id=$key_id" >> "$GITHUB_OUTPUT"

      - name: Configure GPG passphrase
        if: ${{ env.APT_GPG_PRIVATE_KEY != '' && env.APT_GPG_PASSPHRASE != '' }}
        run: |
          cat > ~/.gnupg/gpg-agent.conf <<'GPG_AGENT_CONF'
          allow-preset-passphrase
          pinentry-program /usr/bin/pinentry-curses
          GPG_AGENT_CONF
          gpgconf --kill gpg-agent || true
          gpg --batch --pinentry-mode loopback --passphrase-file ~/.gnupg/passphrase --list-secret-keys >/dev/null

      - name: Build signed APT repository
        if: ${{ env.APT_GPG_PRIVATE_KEY != '' }}
        run: |
          rm -rf public
          for codename in $APT_CODENAMES; do
            ./scripts/build-apt-repository.sh \
              --input "$APT_INPUT_DIR" \
              --output public \
              --codename "$codename" \
              --component "$APT_COMPONENT" \
              --append \
              --allow-empty \
              --gpg-key "${{ steps.gpg.outputs.key-id }}" \
              --require-signature
          done

      - name: Build unsigned APT repository
        if: ${{ env.APT_GPG_PRIVATE_KEY == '' }}
        run: |
          rm -rf public
          for codename in $APT_CODENAMES; do
            ./scripts/build-apt-repository.sh \
              --input "$APT_INPUT_DIR" \
              --output public \
              --codename "$codename" \
              --component "$APT_COMPONENT" \
              --append \
              --allow-empty
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
